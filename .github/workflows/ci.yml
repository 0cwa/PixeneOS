name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Probe candidate executable-tool archives
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import stat
          import urllib.request
          import zipfile

          assets = {
              "afsr": "https://github.com/chenxiaolong/afsr/releases/download/v2.0.0/afsr-2.0.0-x86_64-unknown-linux-gnu.zip",
              "custota-tool": "https://github.com/chenxiaolong/Custota/releases/download/v6.5/custota-tool-6.5-x86_64-unknown-linux-gnu.zip",
          }
          for name, url in assets.items():
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload = response.read()
              print(f"LOCK_PROBE {name} archive_size={len(payload)} archive_sha256={hashlib.sha256(payload).hexdigest()}")
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  for info in archive.infolist():
                      if info.is_dir():
                          continue
                      data = archive.read(info)
                      mode = stat.S_IMODE(info.external_attr >> 16)
                      print(
                          f"LOCK_PROBE {name} member={info.filename} size={len(data)} "
                          f"sha256={hashlib.sha256(data).hexdigest()} mode={mode:04o}"
                      )
          PY

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.sh src/ci/*.sh tests/*.sh; do
            bash -n "${file}"
          done

      - name: ShellCheck when available
        shell: bash
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x -S warning src/main.sh src/setup_hooks.sh
          else
            echo "::notice::ShellCheck is not installed on this runner; skipping ShellCheck."
          fi

      - name: Test avbroot compatibility helper
        shell: bash
        run: bash tests/avbroot_setup_compat_test.sh --strict

      - name: Run deterministic tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/declarations_config_test.sh
          bash tests/typed_config_resolver_test.sh
          bash tests/release_url_config_test.sh
          bash tests/release_existing_build_test.sh
          bash tests/phase3_provider_acquisition_test.sh
          bash tests/executable_tool_lock_test.sh
          bash tests/executable_tool_bootstrap_test.sh
          bash tests/executable_tool_routing_test.sh
          bash tests/phase3_workflows_test.sh
          bash tests/phase3_rom_contract_test.sh
          bash tests/module_selection_test.sh
          bash tests/boot_animation_config_test.sh
          bash tests/boot_animation_registration_test.sh
          python3 tests/boot_animation_test.py
          bash tests/secrets_scan_test.sh
          bash tests/verifier_test.sh
